name: Build and publish Docker images

on:
  push:
    branches:
      - main
      - build/ghcr-images
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  resolve-sources:
    name: Resolve application sources
    runs-on: ubuntu-latest
    outputs:
      backend_branch: ${{ steps.sources.outputs.backend_branch }}
      backend_sha: ${{ steps.sources.outputs.backend_sha }}
      frontend_branch: ${{ steps.sources.outputs.frontend_branch }}
      frontend_sha: ${{ steps.sources.outputs.frontend_sha }}
      source_tag: ${{ steps.sources.outputs.source_tag }}

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve matching branches or main
        id: sources
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
        run: |
          set -euo pipefail

          resolve_source() {
            local path="$1"
            local branch

            if git -C "$path" ls-remote --exit-code --heads origin \
              "refs/heads/$TARGET_BRANCH" >/dev/null; then
              branch="$TARGET_BRANCH"
            else
              branch="main"
            fi

            git -C "$path" fetch --quiet --depth=1 origin \
              "refs/heads/$branch"
            printf '%s %s\n' "$branch" "$(git -C "$path" rev-parse FETCH_HEAD)"
          }

          read -r backend_branch backend_sha < <(resolve_source em_backend)
          read -r frontend_branch frontend_sha < <(resolve_source em_frontend)
          source_tag="${GITHUB_SHA:0:7}-b${backend_sha:0:7}-f${frontend_sha:0:7}"

          {
            echo "backend_branch=$backend_branch"
            echo "backend_sha=$backend_sha"
            echo "frontend_branch=$frontend_branch"
            echo "frontend_sha=$frontend_sha"
            echo "source_tag=$source_tag"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolved application sources"
            echo
            echo "- Event manager branch: \`$TARGET_BRANCH\`"
            echo "- Backend: \`$backend_branch\` at \`${backend_sha:0:7}\`"
            echo "- Frontend: \`$frontend_branch\` at \`${frontend_sha:0:7}\`"
            echo "- Immutable image tag: \`$source_tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend image
    needs: resolve-sources
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out resolved backend source
        env:
          SOURCE_SHA: ${{ needs.resolve-sources.outputs.backend_sha }}
        run: |
          git -C em_backend fetch --quiet --depth=1 origin "$SOURCE_SHA"
          git -C em_backend checkout --quiet --detach "$SOURCE_SHA"

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./em_backend
          file: ./em_backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/event-manager-backend:${{ steps.image.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/event-manager-backend:${{ needs.resolve-sources.outputs.source_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/CEIT-SSC/em_backend
            org.opencontainers.image.revision=${{ needs.resolve-sources.outputs.backend_sha }}
            org.opencontainers.image.event-manager-revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontends:
    name: Frontend image (${{ matrix.app }})
    needs: resolve-sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ssc
            image: event-manager-frontend-ssc
            app_path: apps/ssc
            app_filter: "@ssc/web"
          - app: levelup
            image: event-manager-frontend-levelup
            app_path: apps/level_up
            app_filter: "@ssc/level_up"
          - app: gamecraft
            image: event-manager-frontend-gamecraft
            app_path: apps/game_craft
            app_filter: "@ssc/game_craft"

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out resolved frontend source
        env:
          SOURCE_SHA: ${{ needs.resolve-sources.outputs.frontend_sha }}
        run: |
          git -C em_frontend fetch --quiet --depth=1 origin "$SOURCE_SHA"
          git -C em_frontend checkout --quiet --detach "$SOURCE_SHA"

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve public event ID
        id: frontend-config
        shell: bash
        env:
          LEVELUP_EVENT_ID: ${{ vars.LEVELUP_EVENT_ID }}
          GAMECRAFT_EVENT_ID: ${{ vars.GAMECRAFT_EVENT_ID }}
        run: |
          case "${{ matrix.app }}" in
            levelup) event_id="$LEVELUP_EVENT_ID" ;;
            gamecraft) event_id="$GAMECRAFT_EVENT_ID" ;;
            *) event_id="not-required" ;;
          esac

          if [[ "${{ matrix.app }}" != "ssc" && ! "$event_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Configure the repository variable for the ${{ matrix.app }} event ID." >&2
            exit 1
          fi

          echo "event_id=$event_id" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v7
        with:
          context: ./em_frontend
          file: ./em_frontend/Dockerfile
          push: true
          build-args: |
            APP_PATH=${{ matrix.app_path }}
            APP_FILTER=${{ matrix.app_filter }}
            GAME_CRAFT_SSC_EVENT_ID=${{ steps.frontend-config.outputs.event_id }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/${{ matrix.image }}:${{ steps.image.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/${{ matrix.image }}:${{ needs.resolve-sources.outputs.source_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/CEIT-SSC/em_frontend
            org.opencontainers.image.revision=${{ needs.resolve-sources.outputs.frontend_sha }}
            org.opencontainers.image.event-manager-revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.app }}
